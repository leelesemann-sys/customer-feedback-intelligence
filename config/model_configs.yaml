# Model hyperparameters for Customer Feedback Intelligence

classical:
  logistic_regression:
    C: 1.0
    max_iter: 1000
    solver: lbfgs
    class_weight: balanced
  svm:
    C: 1.0
    kernel: rbf
    class_weight: balanced
    probability: true
  naive_bayes:
    alpha: 1.0

  tfidf:
    max_features: 50000
    ngram_range: [1, 2]
    min_df: 2
    max_df: 0.95
    sublinear_tf: true

bert:
  model_name: deepset/gbert-base
  max_length: 128
  batch_size: 16
  learning_rate: 2.0e-5
  epochs: 3
  warmup_ratio: 0.1
  weight_decay: 0.01
  fp16: true
  early_stopping_patience: 2

llm:
  deployment: gpt-4.1
  temperature: 0.0
  max_tokens: 10
  few_shot_examples: 5
